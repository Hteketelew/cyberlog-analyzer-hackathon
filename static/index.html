  ========================== -->

    <div class="upload">

        type="file"
        accept=".log,.txt"
      >

      <button onclick="analyze()">

        id="status"
        class="small"
      ></div>

    style="display:none"
  >

      <div class="metric">

        <span class="label">
          Log Lines
        </span>

        <b id="total">
          0
        </b>

      </div>


      <!-- Critical -->

      <div class="metric">

        <span class="label">
          Critical
        </span>

        <b
          id="critical"
          class="critical"
        >
          0
        </b>

      </div>


      <!-- High -->

      <div class="metric">

        <span class="label">
          High
        </span>

        <b
          id="high"

          Medium
